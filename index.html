  const cols = 30, rows = 45;
  const grid = Array.from({length: rows}, () => Array(cols).fill(null));
  instructions.forEach(({rows: [r1,r2], cols: [c1,c2], color}) => {
    for (let y = r1; y <= r2; y++) {
      for (let x = c1; x <= c2; x++) {
        grid[y][x] = color;
      }
    }
  });
  return grid;
}

// ============ 状态管理 ============
let selectedCigarette = null;
let currentPriceFilter = 'all';
let currentQuestion = 0;
let answers = [];

function getPriceTier(price) {
  if (price < 10) return 'low';
  if (price <= 20) return 'mid';
  return 'high';
}

// ============ 选烟页 ============
function renderCigarettes(filterText = '') {
  const grid = document.getElementById('cigaretteGrid');
  const searchTerm = filterText.toLowerCase();

  const filtered = cigarettes.filter(c => {
    const matchSearch = !searchTerm ||
      c.name.toLowerCase().includes(searchTerm) ||
      c.shortName.toLowerCase().includes(searchTerm) ||
      c.factory.toLowerCase().includes(searchTerm);
    const matchPrice = currentPriceFilter === 'all' || getPriceTier(c.price) === currentPriceFilter;
    return matchSearch && matchPrice;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="col-span-2 text-center py-8" style="color:#b0a89a;">
      <div class="text-2xl mb-2">🔍</div>
      <p class="text-sm">没有找到匹配的香烟</p>
      <p class="text-xs">换个关键词试试？</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(c => `
    <div class="cig-card bg-white rounded-lg border p-3 text-center"
      style="border-color:#e8e4dc;"
      data-id="${c.id}"
      onclick="selectCigarette('${c.id}', this)">
      <div class="text-2xl mb-1">🚬</div>
      <div class="font-bold text-sm" style="color:#3a3a3a;">${c.shortName}</div>
      <div class="text-xs" style="color:#999;">${c.model}</div>
      <div class="text-xs mt-1 font-medium" style="color:#cc4444;">¥${c.price}</div>
      <div class="text-xs mt-0.5" style="color:#b0a89a;">${c.tag}</div>
    </div>
  `).join('');
}

function filterCigarettes() {
  const text = document.getElementById('searchInput').value;
  renderCigarettes(text);
}

function filterByPrice(tier) {
  currentPriceFilter = tier;
  document.querySelectorAll('.price-tag').forEach(tag => {
    const isActive = tag.dataset.price === tier;
    tag.style.borderColor = isActive ? '#cc4444' : '#e8e4dc';
    tag.style.color = isActive ? '#cc4444' : '#999';
    tag.style.background = isActive ? '#fef5f5' : '#fff';
  });
  renderCigarettes(document.getElementById('searchInput').value);
}

function selectCigarette(id, el) {
  selectedCigarette = cigarettes.find(c => c.id === id);
  document.querySelectorAll('.cig-card').forEach(card => {
    card.style.borderColor = '#e8e4dc';
    card.style.background = '#fff';
  });
  el.style.borderColor = '#cc4444';
  el.style.background = '#fef5f5';
  setTimeout(() => goToStep('question'), 300);
}

// ============ 答题页 ============
function renderQuestion() {
  if (currentQuestion >= questions.length) {
    goToStep('result');
    return;
  }
  const q = questions[currentQuestion];

  if (selectedCigarette) {
    document.getElementById('selectedCigLabel').textContent = selectedCigarette.shortName;
  }

  document.getElementById('questionProgress').textContent = `${currentQuestion + 1}/${questions.length}`;
  document.getElementById('progressBar').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
  document.getElementById('questionText').textContent = q.question;
  document.getElementById('questionText').style.whiteSpace = 'pre-line';

  document.getElementById('optionsContainer').innerHTML = q.options.map(opt => `
    <div class="option-card bg-white rounded-lg border p-4 text-sm"
      style="border-color:#e8e4dc;color:#3a3a3a;"
      onclick="selectOption('${opt.key}', this)">
      <span class="font-bold mr-2" style="color:#cc4444;">${opt.key}.</span>${opt.text}
    </div>
  `).join('');
}

function selectOption(key, el) {
  document.querySelectorAll('.option-card').forEach(card => {
    card.style.pointerEvents = 'none';
  });
  answers.push({ questionId: questions[currentQuestion].id, answer: key });
  el.style.borderColor = '#cc4444';
  el.style.background = '#fef5f5';
  setTimeout(() => {
    currentQuestion++;
    renderQuestion();
  }, 300);
}

// ============ 结果页 ============
function renderResult() {
  const c = selectedCigarette;
  if (!c) return;

  document.getElementById('resultName').textContent = c.name;
  document.getElementById('resultMeta').textContent = `¥${c.price} · ${c.factory}`;
  document.getElementById('resultTag').textContent = c.tag;
  document.getElementById('resultDesc').textContent = c.description || '评价文案加载中...';
  document.getElementById('resultPunchline').textContent = c.punchline || '';

  document.getElementById('resultTraits').innerHTML = `
    <div class="text-center flex-1">
      <div class="text-xs mb-1" style="color:#b0a89a;">📚 学术</div>
      <div class="text-xs" style="color:#3a3a3a;">${c.traits.academic}</div>
    </div>
    <div class="text-center flex-1">
      <div class="text-xs mb-1" style="color:#b0a89a;">🗣 社交</div>
      <div class="text-xs" style="color:#3a3a3a;">${c.traits.social}</div>
    </div>
    <div class="text-center flex-1">
      <div class="text-xs mb-1" style="color:#b0a89a;">💔 感情</div>
      <div class="text-xs" style="color:#3a3a3a;">${c.traits.romance}</div>
    </div>
  `;

  renderPixelArt(c);
}

function renderPixelArt(cig) {
  const box = document.getElementById('pixelArtBox');
  const grid = cig.pixelGrid;
  if (!grid || !grid.length) {
    box.innerHTML = '<div class="text-5xl">🚬</div>';
    return;
  }

  const pixelSize = 3;
  const rows = grid.length;
  const cols = grid[0].length;
  const w = cols * pixelSize;
  const h = rows * pixelSize;

  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.style.display = 'block';
  canvas.style.margin = '0 auto';
  canvas.style.imageRendering = 'pixelated';

  const ctx = canvas.getContext('2d');
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x] !== null) {
        ctx.fillStyle = grid[y][x];
        ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
      }
    }
  }

  box.innerHTML = '';
  box.appendChild(canvas);
}

// ============ 步骤切换 ============
let isTransitioning = false;

function goToStep(stepName) {
  if (isTransitioning) return;
  isTransitioning = true;

  const steps = document.querySelectorAll('.step');

  steps.forEach(el => {
    if (el.id === `step-${stepName}`) {
      el.classList.remove('hidden');
      el.offsetHeight;
      el.style.opacity = '1';
    } else {
      el.style.opacity = '0';
      setTimeout(() => {
        if (el.style.opacity === '0') {
          el.classList.add('hidden');
        }
      }, 300);
    }
  });

  if (stepName === 'question') {
    if (!selectedCigarette) return;
    currentQuestion = 0;
    answers = [];
    setTimeout(() => {
      renderQuestion();
      isTransitioning = false;
    }, 350);
  } else if (stepName === 'result') {
    setTimeout(() => {
      renderResult();
      isTransitioning = false;
    }, 350);
  } else {
    setTimeout(() => { isTransitioning = false; }, 350);
  }
}

function restart() {
  selectedCigarette = null;
  currentQuestion = 0;
  answers = [];
  currentPriceFilter = 'all';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.cig-card').forEach(c => {
    c.style.borderColor = '#e8e4dc';
    c.style.background = '#fff';
  });
  document.querySelectorAll('.price-tag').forEach(tag => {
    const isActive = tag.dataset.price === 'all';
    tag.style.borderColor = isActive ? '#cc4444' : '#e8e4dc';
    tag.style.color = isActive ? '#cc4444' : '#999';
    tag.style.background = isActive ? '#fef5f5' : '#fff';
  });
  renderCigarettes();
  goToStep('select');
}

// ============ 图片保存 ============
async function saveCard() {
  if (!selectedCigarette) return;
  const btn = document.getElementById('saveBtn');
  btn.innerHTML = '⏳ 生成中...';
  btn.disabled = true;

  try {
    const card = document.getElementById('resultCard');
    const canvas = await html2canvas(card, {
      backgroundColor: '#faf8f5',
      scale: 2,
      useCORS: true,
      logging: false
    });
    const link = document.createElement('a');
    link.download = `香烟性格测试_${selectedCigarette.shortName}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.innerHTML = '<i class="fa fa-check mr-1"></i> 已保存';
  } catch (err) {
    console.error('保存失败:', err);
    alert('保存失败，请长按截图保存');
    btn.innerHTML = '<i class="fa fa-download mr-1"></i> 保存卡片';
  }
  btn.disabled = false;
  setTimeout(() => {
    if (btn.innerHTML.includes('已保存')) {
      btn.innerHTML = '<i class="fa fa-download mr-1"></i> 保存卡片';
    }
  }, 3000);
}
